{% extends "base.html" %}
{% block title %}Giriş{% endblock %}
{% block content %}
<div class="card login">
  <h1>Giriş</h1>
  <p class="sub">Active Directory kullanıcı adınız ve parolanızla giriş yapın.</p>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field"><label for="u">Kullanıcı adı</label><input id="u" name="username" value="{{ username or '' }}" autocomplete="username" autofocus required></div>
    <div class="field"><label for="pw">Parola</label><input id="pw" type="password" name="password" autocomplete="current-password" required></div>
    <button class="btn primary" type="submit">Giriş yap</button>
  </form>
</div>
{% endblock %}
